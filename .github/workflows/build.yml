name: Build APK
on: [push, workflow_dispatch]
concurrency: { group: build, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest          # has the Android SDK preinstalled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
      - run: gradle --no-daemon assembleDebug assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-camera-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-camera-release.apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
